<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AtomS3 RC Controller</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #222;
            color: #fff;
            margin: 0;
            padding: 20px;
            touch-action: none; /* スマホのスクロールを防止 */
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #status {
            font-weight: bold;
            color: #ff4444;
            margin-bottom: 20px;
        }
        /* ジョイスティックの背景キャンバス */
        #joystickContainer {
            position: relative;
            width: 250px;
            height: 250px;
            background: #444;
            border-radius: 50%;
            margin: 0 auto;
            border: 3px solid #666;
        }
        /* ジョイスティックのつまみ */
        #stick {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #00bcd4;
            border-radius: 50%;
            top: 95px;
            left: 95px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>AtomS3 Controller</h1>
    <button id="connectBtn">BLE接続</button>
    <div id="status">ステータス: 未接続</div>

    <div id="joystickContainer">
        <div id="stick"></div>
    </div>

    <p id="coords">X: 128, Y: 128</p>

    <script>
        // Arduinoコード側と完全に一致させるUUID
        const SERVICE_UUID        = "4fa8691a-136d-4542-99c0-08d616844272";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleCharacteristic = null;
        let isConnected = false;

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const coordsText = document.getElementById('coords');
        const container = document.getElementById('joystickContainer');
        const stick = document.getElementById('stick');

        const rect = container.getBoundingClientRect();
        const centerX = 125;
        const centerY = 125;
        const maxRadius = 95;

        // --- BLE接続処理 ---
        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "デバイス検索中...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'AtomS3-RC' }],
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.innerText = "接続中...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                isConnected = true;
                statusDiv.innerText = "ステータス: 接続完了！";
                statusDiv.style.color = "#00ff00";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "接続失敗: " + error;
                statusDiv.style.color = "#ff4444";
            }
        });

        // --- タッチ・マウス操作イベント ---
        let isDragging = false;

        function handleMove(event) {
            if (!isDragging) return;

            const touch = event.touches ? event.touches[0] : event;
            const containerRect = container.getBoundingClientRect();

            let touchX = touch.clientX - containerRect.left - centerX;
            let touchY = touch.clientY - containerRect.top - centerY;

            // 円の範囲制限
            const distance = Math.sqrt(touchX * touchX + touchY * touchY);
            if (distance > maxRadius) {
                touchX = (touchX / distance) * maxRadius;
                touchY = (touchY / distance) * maxRadius;
            }

            // 見た目の更新
            stick.style.left = `${centerX + touchX - 30}px`;
            stick.style.top = `${centerY + touchY - 30}px`;

            // 0〜255の範囲に正規化 (中心が128)
            const sendX = Math.round(((touchX / maxRadius) + 1) * 127.5);
            const sendY = Math.round(((touchY / maxRadius) + 1) * 127.5);

            coordsText.innerText = `X: ${sendX}, Y: ${sendY}`;

            // BLEで送信
            sendData(sendX, sendY);
        }

        function handleEnd() {
            if (!isDragging) return;
            isDragging = false;

            // つまみを中央に戻す
            stick.style.left = '95px';
            stick.style.top = '95px';
            coordsText.innerText = "X: 128, Y: 128";

            // 停止データ（中央値）を送信
            sendData(128, 128);
        }

        container.addEventListener('mousedown', (e) => { isDragging = true; handleMove(e); });
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        container.addEventListener('touchstart', (e) => { isDragging = true; handleMove(e); });
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        // BLEデータ送信処理 (WriteWithoutResponse)
        async function sendData(x, y) {
            if (!isConnected || !bleCharacteristic) return;
            try {
                const data = new Uint8Array([x, y]);
                await bleCharacteristic.writeValueWithoutResponse(data);
            } catch (e) {
                console.error("送信エラー:", e);
            }
        }
    </script>
</body>
</html>
