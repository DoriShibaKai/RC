<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>遠隔操作カメラ</title>


<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/mobile.css">


</head>

<body>
  <main class="container">

    <!-- =====================================
         上部タイトル
    ====================================== -->

    <header class="appHeader">
      <div class="appTitleArea">

        <div
          class="cameraLogo"
          aria-hidden="true"
        ></div>

        <div class="appTitleText">
          <h1>遠隔操作カメラ</h1>

          <p class="appSubtitle">
            映像を見ながら遠隔操作
          </p>
        </div>
      </div>

      <div class="headerBadge">
        <span class="headerBadgeDot"></span>
        WebRTC
      </div>
    </header>

    <!-- =====================================
         接続操作
    ====================================== -->

    <section class="panel">

      <div class="roomRow">
        <div class="roomField">

          <label
  id="roomNameLabel"
  for="roomName"
>
  接続する部屋名
</label>

          <input
            id="roomName"
            type="text"
            value="home-camera"
            maxlength="50"
            autocomplete="off"
          >

        </div>
      </div>

      <!-- WebRTC操作ボタン -->

      <div class="buttons">

        <button
          id="sendButton"
          class="mainActionButton"
          type="button"
        >

          <span
            class="mainActionIcon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <rect
                x="7"
                y="2.5"
                width="10"
                height="19"
                rx="2"
              ></rect>

              <line
                x1="10"
                y1="5.5"
                x2="14"
                y2="5.5"
              ></line>

              <circle
                cx="12"
                cy="18.5"
                r="0.7"
              ></circle>
            </svg>
          </span>

          <span class="mainActionText">
            <span class="mainActionTitle">
              カメラ送信
            </span>
          </span>

        </button>

        <button
          id="viewButton"
          class="mainActionButton"
          type="button"
        >

          <span
            class="mainActionIcon"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24">
              <rect
                x="3"
                y="4"
                width="18"
                height="13"
                rx="2"
              ></rect>

              <line
                x1="8"
                y1="21"
                x2="16"
                y2="21"
              ></line>

              <line
                x1="12"
                y1="17"
                x2="12"
                y2="21"
              ></line>
            </svg>
          </span>

          <span class="mainActionText">
            <span class="mainActionTitle">
              映像を受信
            </span>
          </span>

        </button>

      </div>

      <p class="note">
        通信するデバイスは同じ部屋名を使用
      </p>

      <!-- 機器・通信管理 -->

      <section class="deviceManagement">

        <h2 class="deviceManagementTitle">
          機器・通信管理
        </h2>

        <div class="deviceManagementRow">

          <div class="bleConnectionCard">

            <span
              class="bleConnectionIcon"
              aria-hidden="true"
            >
              <svg viewBox="0 0 24 24">
                <path d="M7 7l10 10-5 5V2l5 5L7 17"></path>
              </svg>
            </span>

            <div class="bleConnectionInformation">

              <p class="bleConnectionTitle">
                BLE接続：
                <span id="bleConnectionStatus">
                  未接続
                </span>
              </p>

              <p class="bleConnectionDescription">
                <span
                  id="bleStatusDot"
                  class="bleStatusDot"
                  aria-hidden="true"
                ></span>

                機器に接続して操作できます
              </p>

            </div>

          <button
  id="bleConnectButton"
  type="button"
>
  BLE接続
</button>

          </div>

          <button
            id="stopButton"
            class="mainActionButton"
            type="button"
            disabled
          >

            <span
              class="mainActionIcon"
              aria-hidden="true"
            >
              <svg viewBox="0 0 24 24">
                <path d="M12 2v9"></path>

                <path
                  d="M6.1 5.8a9 9 0 1 0 11.8 0"
                ></path>
              </svg>
            </span>

            <span class="mainActionText">

             <span class="mainActionTitle">
  すべて切断
</span>

<span class="mainActionDescription">
  WebRTCとBLEを終了
</span>

            </span>

          </button>

        </div>

      </section>

      <!-- ===================================
           詳細設定
      ==================================== -->

<details id="settingsPanel">

  <summary>
    <span>詳細設定</span>
  </summary>

  <div class="settingsContent">

    <!-- ===================================
         STOP設定
    ==================================== -->

    <section class="settingsGroup">

      <h2 class="settingsGroupTitle">
        STOP設定
      </h2>

<div class="settingsGroupCards">

        <!-- STOPボタン表示設定 -->

        <section
          class="
            settingsSection
            stopVisibilitySettingsSection
          "
        >

          <div class="settingsSectionTitle">
            STOPボタン
          </div>

          <span class="settingsDescription">
            映像上のSTOPボタンを表示
          </span>

          <label class="stopVisibilityControl">

            <input
              id="stopButtonVisibleToggle"
              type="checkbox"
              checked
            >

            <span
              class="stopVisibilitySwitch"
              aria-hidden="true"
            ></span>

            <span
              id="stopVisibilityState"
              class="stopVisibilityState"
            >
              表示
            </span>

          </label>

        </section>

        <!-- パソコン設定 -->

        <section
          class="
            settingsSection
            pcSettingsSection
          "
        >

          <div class="settingsSectionTitle">
            パソコン
          </div>

          <label
            class="settingsField"
            for="pcStopKey"
          >

            <span class="settingsLabel">
              STOPキー
            </span>

            <span class="settingsDescription">
              選択したキーを押してSTOP
            </span>

            <select id="pcStopKey">

              <option
                value="Space"
                selected
              >
                Space
              </option>

              <option value="Enter">
                Enter
              </option>

              <option value="KeyS">
                S
              </option>

              <option value="None">
                使用しない
              </option>

            </select>

          </label>

        </section>

      </div>

      <p class="settingsGroupNote">
        詳細設定を開いている間は，映像上のSTOPボタンを移動・サイズ変更できます。
      </p>

    </section>

    <!-- ===================================
     走行速度設定
==================================== -->

<section class="settingsGroup">

  <h2 class="settingsGroupTitle">
    走行速度
  </h2>

  <div class="settingsGroupCards">

    <section class="settingsSection">

      <div class="settingsSectionTitle">
        速度
      </div>

      <span class="settingsDescription">
        ラジコンの走行速度を選択
      </span>

      <select id="driveSpeedSelect">
  <option value="0.25" selected>
    おそい
  </option>

  <option value="1.0">
    はやい
  </option>
</select>

    </section>

  </div>

</section>

    <!-- ===================================
         背景設定
    ==================================== -->

    <section class="settingsGroup">

         <div class="settingsGroupCards">

        <section
          class="
            settingsSection
            backgroundSettingsSection
          "
        >

          <div class="settingsSectionTitle">
            画面テーマ
          </div>

          <span class="settingsDescription">
            背景色切り替え
          </span>

          <!--
            今は見た目だけ用意する。
            背景切替機能を作るときにdisabledを削除する。
          -->
          <label class="themeToggleControl">

            <input
              id="themeModeToggle"
              type="checkbox"

            >

            <span
              class="themeToggleSwitch"
              aria-hidden="true"
            ></span>

            <span class="themeToggleText">
              ダーク
            </span>

          </label>

        </section>

      </div>

    </section>

  </div>

</details>

    </section>

    <!-- =====================================
         状態・映像
    ====================================== -->

    <section class="panel connectionPanel">

  <div class="compactStatusRow">

  <p id="xyDisplay">X：0.00　Y：0.00</p>

<p id="driveStatus">操縦命令：未受信</p>

  <p id="status" class="hiddenStatus">
    どちらかのボタンを押してください。
  </p>

</div>

      <!-- 映像・ジョイスティック・STOPボタン -->

      <div id="videoWrapper">

        <video
          id="video"
          autoplay
          playsinline
          muted
          class="hidden"
        ></video>

        <div id="joystickArea">
          <div id="joystickKnob"></div>
        </div>

        <div
          id="fullscreenHoldIndicator"
          aria-hidden="true"
        >
          <div class="fullscreenHoldLabel">長押し中</div>
        </div>

        <button
          id="driveStopButton"
          type="button"
          disabled
        >

          <span id="driveStopButtonText">
            STOP
          </span>

          <span
            id="stopResizeHandle"
            aria-hidden="true"
          >
            ↘
          </span>

        </button>

        <!-- PC用：全画面表示ボタン -->
        <button
          id="pcFullscreenButton"
          type="button"
          aria-label="映像を全画面表示"
          title="全画面表示"
        >

          <svg
            id="pcFullscreenIcon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="
                M4 9V4H9
                M15 4H20V9
                M20 15V20H15
                M9 20H4V15
              "
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </svg>

        </button>

      </div>

    </section>

  </main>

<script src="js/appState.js?v=2"></script>
<script src="js/ui.js?v=5"></script>
<script src="js/emergencyStop.js?v=4"></script>
<script src="js/ble.js?v=2"></script>
<script src="js/dataChannel.js?v=2"></script>
<script src="js/webrtc.js?v=3"></script>
<script src="js/drive.js?v=2"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
