<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>WebRTCカメラ</title>

  

  
<style>
  * {
    box-sizing: border-box;
  }

  :root {
    color-scheme: dark;

    --page-bg: #050c1c;
    --panel-bg: rgba(12, 24, 48, 0.94);
    --panel-bg-light: rgba(20, 36, 67, 0.96);
    --border-color: rgba(148, 173, 220, 0.18);

    --text-main: #f7f9ff;
    --text-sub: #aab8d4;

    --blue-start: #5265ed;
    --blue-end: #3347c6;

    --green-start: #3e927b;
    --green-end: #246758;

    --gray-start: #33415f;
    --gray-end: #202c46;

    --danger-start: #f04444;
    --danger-end: #d7222c;

    --accent: #62df83;
  }

  body {
    min-height: 100vh;
    margin: 0;
    padding: 14px;
    background:
      radial-gradient(
        circle at top left,
        rgba(56, 81, 160, 0.25),
        transparent 38%
      ),
      linear-gradient(
        180deg,
        #050b18 0%,
        #071329 55%,
        #050b18 100%
      );
    color: var(--text-main);
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      "Hiragino Sans",
      "Yu Gothic",
      Meiryo,
      sans-serif;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    width: min(920px, 100%);
    margin: 0 auto;
  }

  /* ======================================
     上部ヘッダー
  ====================================== */

  .appHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
    padding: 4px 4px 2px;
  }

  .appTitleArea {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .cameraLogo {
    position: relative;
    display: grid;
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    place-items: center;
    border: 1px solid rgba(117, 155, 255, 0.28);
    border-radius: 50%;
    background:
      radial-gradient(
        circle,
        #5dd3ff 0 12%,
        #162447 13% 28%,
        #5874ff 29% 37%,
        #101b35 38% 58%,
        #223c72 59% 100%
      );
    box-shadow:
      0 0 24px rgba(68, 113, 255, 0.35),
      inset 0 0 12px rgba(255, 255, 255, 0.18);
  }

  .cameraLogo::after {
    content: "";
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    filter: blur(1px);
    transform: translate(-5px, -5px);
  }

  .appTitleText {
    min-width: 0;
  }

  h1 {
    margin: 0;
    font-size: clamp(20px, 3vw, 27px);
    line-height: 1.15;
    letter-spacing: 0.02em;
  }

  .appSubtitle {
    margin: 5px 0 0;
    color: var(--text-sub);
    font-size: 13px;
  }

  .headerBadge {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    padding: 9px 13px;
    border: 1px solid rgba(129, 157, 210, 0.22);
    border-radius: 999px;
    background: rgba(12, 24, 48, 0.72);
    color: #dbe6ff;
    font-size: 13px;
    font-weight: bold;
  }

  .headerBadgeDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(98, 223, 131, 0.8);
  }

  /* ======================================
     共通パネル
  ====================================== */

  .panel {
    position: relative;
    margin-bottom: 14px;
    padding: 15px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    border-radius: 17px;
    background:
      linear-gradient(
        145deg,
        rgba(17, 31, 59, 0.97),
        rgba(8, 19, 40, 0.98)
      );
    box-shadow:
      0 16px 38px rgba(0, 0, 0, 0.27),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .panel::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(
        110deg,
        rgba(255, 255, 255, 0.025),
        transparent 32%
      );
  }

  .panel > * {
    position: relative;
    z-index: 1;
  }

  /* ======================================
     部屋名入力
  ====================================== */

  .roomRow {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 12px;
  }

  .roomField {
    flex: 1;
    min-width: 0;
  }

  label {
    display: block;
    margin-bottom: 6px;
    color: #dce6fb;
    font-size: 14px;
    font-weight: bold;
  }

  input {
    width: 100%;
    min-height: 46px;
    margin: 0;
    padding: 10px 13px;
    border: 1px solid rgba(151, 177, 225, 0.32);
    border-radius: 10px;
    outline: none;
    background: rgba(3, 10, 25, 0.72);
    color: #ffffff;
    font-size: 16px;
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }

  input:focus {
    border-color: #6f8eff;
    box-shadow: 0 0 0 3px rgba(86, 119, 255, 0.18);
  }

  input:disabled {
    color: #9ca9c3;
    background: rgba(6, 13, 28, 0.5);
  }

  /* ======================================
     3つの操作ボタン
  ====================================== */

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

 .mainActionButton {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  min-width: 0;
  min-height: 72px;
  padding: 10px 12px;

  overflow: hidden;

  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 13px;

  color: #ffffff;
  cursor: pointer;

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    0 8px 19px rgba(0, 0, 0, 0.18);

  transition:
    transform 0.15s,
    filter 0.2s,
    box-shadow 0.2s;
}

  .mainActionButton:hover:not(:disabled) {
    filter: brightness(1.08);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 12px 24px rgba(0, 0, 0, 0.24);
  }

  .mainActionButton:active:not(:disabled) {
    transform: scale(0.98);
  }

 .mainActionIcon {
  position: absolute;
  left: calc(50% - 105px);

  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
}

/* ======================================
   PC用ボタン位置微調整
====================================== */

/* PCの「カメラ送信」ボタンの文字
   数字大きいと右へずれる */
#sendButton .mainActionText {
  transform: translateX(7px);
}

/* PCの「カメラ送信」ボタンのアイコン
   数字大きいと右へずれる */
#sendButton .mainActionIcon {
  transform: translateX(28px);
}

/* PCの「映像を受信」ボタンの文字
   数字大きいと右へずれる */
#viewButton .mainActionText {
  transform: translateX(11px);
}

/* PCの「映像を受信」ボタンのアイコン
   数字大きいと右へずれる */
#viewButton .mainActionIcon {
  transform: translateX(30px);
}

/* PCの「接続を終了」ボタンの文字
   数字大きいと右へずれる */
#stopButton .mainActionText {
  transform: translateX(9px);
}

/* PCの「接続を終了」ボタンのアイコン
   数字大きいと右へずれる */
#stopButton .mainActionIcon {
  transform: translateX(29px);
}

  .mainActionIcon svg {
    width: 29px;
    height: 29px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

 .mainActionText {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  margin: 0;
   transform: translateX(10px);
}

.mainActionTitle {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.25;
  white-space: nowrap;
}

 

  .mainActionDescription {
    color: rgba(255, 255, 255, 0.72);
    font-size: 10px;
    font-weight: normal;
    line-height: 1.25;
  }

  #sendButton {
    background:
      linear-gradient(
        145deg,
        var(--blue-start),
        var(--blue-end)
      );
  }

  #viewButton {
    background:
      linear-gradient(
        145deg,
        var(--green-start),
        var(--green-end)
      );
  }

  #stopButton {
    margin: 0;
    background:
      linear-gradient(
        145deg,
        var(--gray-start),
        var(--gray-end)
      );
  }

  button:disabled {
    cursor: default;
    opacity: 0.48;
    filter: saturate(0.55);
  }

  .note {
    margin: 11px 1px 0;
    color: var(--text-sub);
    font-size: 12px;
    line-height: 1.55;
  }

  /* ======================================
     詳細設定
  ====================================== */

  #settingsPanel {
    margin-top: 12px;
    overflow: hidden;
    border: 1px solid rgba(140, 168, 220, 0.21);
    border-radius: 12px;
    background: rgba(14, 27, 52, 0.82);
  }



  #settingsPanel summary::-webkit-details-marker {
    display: none;
  }

  #settingsPanel summary::before {
    content: "";
    width: 18px;
    height: 18px;
    margin-right: 10px;
    background:
      linear-gradient(#9eb3dc, #9eb3dc) 2px 5px / 14px 2px no-repeat,
      linear-gradient(#9eb3dc, #9eb3dc) 2px 11px / 14px 2px no-repeat,
      radial-gradient(circle, #ffffff 0 2px, transparent 2.5px)
        5px 6px / 6px 6px no-repeat,
      radial-gradient(circle, #ffffff 0 2px, transparent 2.5px)
        10px 12px / 6px 6px no-repeat;
  }

  #settingsPanel summary::after {
    content: "›";
    margin-left: auto;
    color: #aebdde;
    font-size: 25px;
    font-weight: normal;
    line-height: 1;
    transition: transform 0.2s;
  }

  #settingsPanel[open] summary {
    border-bottom: 1px solid rgba(140, 168, 220, 0.17);
    background: rgba(34, 56, 98, 0.72);
  }

  #settingsPanel[open] summary::after {
    transform: rotate(90deg);
  }

  .settingsContent {
    padding: 11px;
    background: rgba(4, 13, 30, 0.5);
  }

  .settingsSection {
    margin-bottom: 10px;
    padding: 13px;
    overflow: hidden;
    border: 1px solid rgba(140, 168, 220, 0.17);
    border-radius: 10px;
    background: rgba(18, 33, 61, 0.88);
  }

  .settingsSection:last-child {
    margin-bottom: 0;
  }

  .settingsSectionTitle {
    margin: -13px -13px 12px;
    padding: 9px 13px;
    border-bottom: 1px solid rgba(105, 145, 220, 0.18);
    background: rgba(35, 62, 111, 0.68);
    color: #cfe0ff;
    font-size: 15px;
    font-weight: bold;
  }

  .settingsToggleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    cursor: pointer;
  }

  .settingsToggleRow input[type="checkbox"] {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin: 0;
    cursor: pointer;
  }

  .settingsText {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .settingsField {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 0;
  }

  .settingsLabel {
    color: #f0f5ff;
    font-size: 15px;
    font-weight: bold;
  }

  .settingsDescription {
    color: #9eadc8;
    font-size: 12px;
    line-height: 1.5;
  }

  .settingsField select {
    width: 100%;
    min-height: 44px;
    margin-top: 5px;
    padding: 8px 36px 8px 11px;
    border: 1px solid rgba(151, 177, 225, 0.32);
    border-radius: 8px;
    outline: none;
    background: #0a1730;
    color: #ffffff;
    font-size: 15px;
  }

  .settingsActionButton {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    border: 1px solid rgba(125, 160, 228, 0.42);
    border-radius: 9px;
    background:
      linear-gradient(
        145deg,
        rgba(49, 82, 143, 0.82),
        rgba(29, 52, 99, 0.9)
      );
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition:
      transform 0.15s,
      filter 0.2s;
  }

  .settingsActionButton:hover {
    filter: brightness(1.12);
  }

  .settingsActionButton:active {
    transform: scale(0.98);
  }

  .settingsActionDescription {
    margin: 8px 2px 0;
  }

  /* ======================================
     状態表示
  ====================================== */

 
.compactStatusRow {
  display: flex;
  align-items: flex-start;
  width: 100%;
  gap: 6px;
  margin: 0 0 6px;
}

#xyDisplay,
#driveStatus {
  display: block;

  box-sizing: border-box;
  min-height: 24px;
  margin: 0;
  padding: 3px 7px;

  border: 1px solid rgba(129, 157, 210, 0.16);
  border-radius: 8px;

  background: rgba(4, 12, 28, 0.72);
  color: #dce7ff;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size: 12px;
  line-height: 16px;
}

#xyDisplay {
  flex: 0 0 auto;
  white-space: nowrap;
}

#driveStatus {
  flex: 1 1 auto;
  min-width: 0;

  text-align: left;

  white-space: normal;
  overflow-wrap: anywhere;
}

.hiddenStatus {
  display: none;
}

/* hiddenクラスを付けた要素は完全に非表示 */
.hidden {
  display: none !important;
}

.connectionPanel {
  padding: 8px 10px 10px;
}

  /* ======================================
     映像領域
  ====================================== */

  #videoWrapper {
    position: relative;
    width: 100%;
    overflow: hidden;
    border: 1px solid rgba(140, 168, 220, 0.2);
    border-radius: 13px;
    background:
      radial-gradient(
        circle at center,
        #101b31,
        #01040b 72%
      );
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.025),
      0 10px 24px rgba(0, 0, 0, 0.24);
    
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* iPhone/Safariの長押しによる文字・画面選択を防ぐ */
  #videoWrapper,
  #videoWrapper * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #videoWrapper video {
    -webkit-user-drag: none;
  }

  video {
    display: block;
    width: 100%;
    max-height: 78vh;
    margin: 0;
    border-radius: 0;
    background: #000000;
    object-fit: contain;
  }

 /* ======================================
   映像の全画面ボタン
====================================== */

#pcFullscreenButton {
  position: absolute;
  right: 12px;
  bottom: 12px;

  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;

  margin: 0;
  padding: 0;

  z-index: 40;

  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: 9px;

  background: rgba(0, 0, 0, 0.58);
  color: #ffffff;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  touch-action: manipulation;
}

#pcFullscreenButton:hover {
  background: rgba(0, 0, 0, 0.78);
}

#pcFullscreenButton svg {
  width: 24px;
  height: 24px;
  pointer-events: none;
}


/* ======================================
   本当の全画面表示
   PCなどの対応ブラウザ
====================================== */

#videoWrapper:fullscreen {
  width: 100vw;
  height: 100vh;

  border: none;
  border-radius: 0;

  background: #000000;
}

#videoWrapper:fullscreen video {
  width: 100%;
  height: 100%;
  max-height: none;

  border-radius: 0;
  object-fit: contain;
}

#videoWrapper:fullscreen #pcFullscreenButton {
  right: 18px;
  bottom: 18px;
}


/* ======================================
   iPhone用：疑似全画面
====================================== */

body.mobilePseudoFullscreenActive {
  overflow: hidden;
}

#videoWrapper.mobilePseudoFullscreen {
  position: fixed;

  /*
    iPhone版Chromeでは，
    JavaScriptで実際に見えている画面範囲を入れる
  */

  left: var(--mobile-viewport-left, 0px);
  top: var(--mobile-viewport-top, 0px);

  width: var(--mobile-viewport-width, 100vw);
  height: var(--mobile-viewport-height, 100dvh);

  z-index: 2000;

  margin: 0;
  padding: 0;

  border: none;
  border-radius: 0;

  background: #000000;
}

#videoWrapper.mobilePseudoFullscreen video {
  width: 100%;
  height: 100%;
  max-height: none;

  border-radius: 0;
  object-fit: contain;
}

#videoWrapper.mobilePseudoFullscreen #pcFullscreenButton {
  right: max(12px, env(safe-area-inset-right));
  bottom: max(12px, env(safe-area-inset-bottom));
}


/* ======================================
   iPhone・小さい画面
====================================== */

@media (max-width: 700px), (pointer: coarse) {

  /* 通常は全画面アイコンを隠す */
  #pcFullscreenButton {
    display: none;

    width: 50px;
    height: 50px;
    min-width: 50px;
    min-height: 50px;

    right: 10px;
    bottom: 10px;
  }

  /* 右下を3秒長押ししたときだけ表示 */
  #pcFullscreenButton.mobileFullscreenVisible {
    display: flex;
  }
}


/* さらに小さい画面 */

@media (max-width: 370px) {

  #pcFullscreenButton {
    width: 46px;
    height: 46px;
    min-width: 46px;
    min-height: 46px;

    right: 8px;
    bottom: 8px;
  }
}

  /* ======================================
     映像上のSTOPボタン
  ====================================== */

  #driveStopButton {
  position: absolute;
  left: 68%;
  top: 4%;

  width: 28%;
  height: 15%;
  min-width: 100px;
  min-height: 52px;

  margin: 0;
  padding: 8px 15px;

  z-index: 30;

  /* 画像のような細い明るい縁 */
  border: 1px solid rgba(255, 255, 255, 0.7);

  /* 角を丸くする */
  border-radius: 10px;

  /* 明るい赤のグラデーション */
  background:
    linear-gradient(
      145deg,
      #f45151 0%,
      #e5363e 55%,
      #d92732 100%
    );

  color: #ffffff;

  font-size: 16px;
  font-weight: bold;

  /* 画像に近い控えめな影 */
  box-shadow:
    0 5px 12px rgba(90, 0, 8, 0.32),
    inset 0 1px 0 rgba(255, 255, 255, 0.28);

  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* STOP文字の左側にある白い四角 */
#driveStopButton::before {
  content: "";
  display: inline-block;

  width: 12px;
  height: 12px;
  flex-shrink: 0;

  margin-right: 7px;

  border-radius: 2px;
  background: #ffffff;
}

/* 使用できない状態でも白い四角を薄くしない */
#driveStopButton:disabled::before {
  opacity: 1;
}
  #driveStopButtonText {
    pointer-events: none;
  }

  #stopResizeHandle {
    display: none;
    position: absolute;
    right: 2px;
    bottom: 0;
    width: 32px;
    height: 32px;
    align-items: center;
    justify-content: center;
    border-radius: 8px 0 8px 0;
    background: rgba(0, 0, 0, 0.48);
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
    cursor: nwse-resize;
    touch-action: none;
  }

  /* ======================================
     ジョイスティック
  ====================================== */

  #joystickArea {
    position: absolute;
    left: 0;
    top: 0;
    display: none;
    width: 140px;
    height: 140px;
    transform: translate(-50%, -50%);
    z-index: 10;
    border: 2px solid rgba(255, 255, 255, 0.42);
    border-radius: 50%;
    background: rgba(8, 18, 38, 0.3);
    box-shadow:
      0 0 0 8px rgba(0, 0, 0, 0.08),
      inset 0 0 25px rgba(255, 255, 255, 0.08);
  }

  #joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 50px;
    height: 50px;
    margin-left: -25px;
    margin-top: -25px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.82);
    box-shadow: 0 4px 13px rgba(0, 0, 0, 0.35);
  }

/*
  右下を400ミリ秒以上動かずに押した場合だけ，
  長押し候補として黄色への変化を開始する
*/
#joystickArea.fullscreenHoldPending {
  transition:
    border-color 2.6s linear,
    background 2.6s linear,
    box-shadow 2.6s linear;
}

#joystickArea.fullscreenHoldPending #joystickKnob {
  transition:
    border-color 2.6s linear,
    background 2.6s linear;
}


/*
  長押し候補の最終的な黄色
*/
#joystickArea.fullscreenHoldPending.fullscreenHoldProgress {
  border-color: rgba(255, 183, 0, 1);
  background: rgba(255, 190, 35, 0.48);
  box-shadow:
    0 0 0 10px rgba(255, 190, 0, 0.20),
    0 0 32px rgba(255, 190, 0, 0.60),
    inset 0 0 28px rgba(255, 245, 170, 0.38);
}

#joystickArea.fullscreenHoldPending.fullscreenHoldProgress
#joystickKnob {
  border-color: rgba(255, 174, 0, 1);
  background: rgba(255, 202, 55, 1);
}


/*
  3秒長押しが成立した瞬間に，
  一瞬明るくなって勢いよく消える
*/
#joystickArea.fullscreenHoldCompleted {
  pointer-events: none;
  animation: fullscreenHoldPopOut 0.18s ease-out forwards;
}

@keyframes fullscreenHoldPopOut {
  0% {
    opacity: 1;
    filter: brightness(1);
  }

  35% {
    opacity: 1;
    filter: brightness(1.8);
  }

  100% {
    opacity: 0;
    filter: brightness(1.2);
  }
}

/* ======================================
   詳細設定：カード型デザイン完成版
====================================== */

#settingsPanel {
  margin-top: 12px;
  overflow: hidden;
  border: 1px solid rgba(125, 157, 215, 0.28);
  border-radius: 15px;
  background: rgba(7, 18, 39, 0.9);
}

/* 詳細設定の見出し */
#settingsPanel summary {
  display: flex;
  align-items: center;
  min-height: 54px;
  padding: 0 18px;
  border: 0;
  background:
    linear-gradient(
      145deg,
      rgba(32, 59, 106, 0.98),
      rgba(21, 42, 80, 0.98)
    );
  color: #ffffff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  list-style: none;
}

#settingsPanel summary::-webkit-details-marker {
  display: none;
}

#settingsPanel summary::before {
  content: "";
  width: 21px;
  height: 21px;
  margin-right: 11px;
  background:
    linear-gradient(#d6e2ff, #d6e2ff) 2px 5px / 16px 2px no-repeat,
    linear-gradient(#d6e2ff, #d6e2ff) 2px 13px / 16px 2px no-repeat,
    radial-gradient(circle, #ffffff 0 2px, transparent 2.5px)
      5px 6px / 7px 7px no-repeat,
    radial-gradient(circle, #ffffff 0 2px, transparent 2.5px)
      11px 14px / 7px 7px no-repeat;
}

#settingsPanel summary::after {
  content: "⌄";
  margin-left: auto;
  color: #d6e2ff;
  font-size: 18px;
  line-height: 1;
  transition: transform 0.2s;
}

#settingsPanel[open] summary {
  border-bottom: 1px solid rgba(135, 167, 225, 0.24);
}

#settingsPanel[open] summary::after {
  transform: rotate(180deg);
}

/* 詳細設定の中全体 */
.settingsContent {
  display: flex;
  flex-direction: column;
  gap: 11px;
  padding: 12px;
  background: rgba(3, 11, 27, 0.72);
}

/* 3つのカード共通 */
.settingsSection {
  position: relative;
  display: grid;

  grid-template-columns:
    56px
    minmax(0, 1fr)
    minmax(180px, 31%);

  grid-template-rows: auto auto;

  column-gap: 13px;
  row-gap: 4px;
  align-items: center;

  min-height: 82px;
  margin: 0;
  padding: 13px 14px;

  overflow: visible;
  border: 1px solid rgba(124, 157, 216, 0.2);
  border-radius: 13px;

  background:
    linear-gradient(
      145deg,
      rgba(17, 34, 65, 0.98),
      rgba(12, 27, 54, 0.98)
    );

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.035),
    0 6px 14px rgba(0, 0, 0, 0.13);
}

/* 左側の丸いアイコン */
.settingsSection::before {
  grid-column: 1;
  grid-row: 1 / 3;

  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;

  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 50%;

  font-size: 23px;
  font-weight: normal;
  line-height: 1;
}

/* STOPボタン */
.settingsSection:nth-child(1)::before {
  content: "□";
  background: rgba(145, 40, 67, 0.28);
  color: #ff6e88;
}

/* パソコン */
.settingsSection:nth-child(2)::before {
  content: "⌨";
  background: rgba(34, 125, 80, 0.25);
  color: #66e59a;
  font-size: 21px;
}

/* iPhone */
.settingsSection:nth-child(3)::before {
  content: "♢";
  background: rgba(117, 57, 152, 0.28);
  color: #d987ff;
}

/* STOPボタン・パソコン・iPhoneのタイトル */
.settingsSectionTitle {
  grid-column: 2;
  grid-row: 1;

  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;

  color: #f3f6ff;
  font-size: 17px;
  font-weight: bold;
  line-height: 1.3;
}

/* 説明文共通 */
.settingsDescription {
  color: #9eacc8;
  font-size: 14px;
  line-height: 1.45;
}

/* STOPボタンの説明 */
.settingsActionDescription {
  grid-column: 2;
  grid-row: 2;
  margin: 0;
  padding: 0;
}

/* STOPボタン編集 */
.settingsActionButton {
  grid-column: 3;
  grid-row: 1 / 3;

  width: 100%;
  min-height: 43px;
  margin: 0;
  padding: 8px 14px;

  border: 1px solid rgba(137, 171, 231, 0.42);
  border-radius: 999px;

  background:
    linear-gradient(
      145deg,
      rgba(13, 29, 56, 0.98),
      rgba(8, 20, 42, 0.98)
    );

  color: #ffffff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.06),
    0 4px 10px rgba(0, 0, 0, 0.18);
}

.settingsActionButton::after {
  content: "›";
  margin-left: 12px;
  color: #cfddfb;
  font-size: 20px;
  font-weight: normal;
  vertical-align: -1px;
}

.settingsActionButton:hover {
  filter: brightness(1.13);
}

/*
  パソコン・iPhoneのlabel自体は箱を作らず、
  中の説明文とプルダウンをカードのグリッドへ直接配置
*/
.settingsField {
  display: contents;
}

/* STOPキー・STOPジェスチャーは非表示 */
.settingsLabel {
  display: none;
}

/* パソコン・iPhoneの説明文 */
.settingsField .settingsDescription {
  grid-column: 2;
  grid-row: 2;
}

/* パソコン・iPhoneのプルダウン */
.settingsField select {
  grid-column: 3;
  grid-row: 1 / 3;

  width: 100%;
  min-height: 43px;
  margin: 0;
  padding: 8px 38px 8px 13px;

  border: 1px solid rgba(133, 165, 220, 0.3);
  border-radius: 9px;
  outline: none;

  background: #07142c;
  color: #ffffff;

  font-size: 15px;
  font-weight: bold;

  box-shadow:
    inset 0 1px 3px rgba(0, 0, 0, 0.22),
    0 2px 7px rgba(0, 0, 0, 0.12);
}

    function connectWebSocket(roomName) {
      return new Promise((resolve, reject) => {
        const protocol =
          location.protocol === "https:" ? "wss:" : "ws:";

        const socketUrl =
          protocol +
          "//" +
          location.host +
          "/ws/" +
          encodeURIComponent(roomName);

        socket = new WebSocket(socketUrl);

        socket.onopen = () => {
          sendSignal({
            type: "role",
            role
          });

          if (role === "sender") {
            sendSignal({
              type: "sender-ready"
            });

            setStatus(
              "カメラを準備しました。\n" +
              "パソコン側の接続を待っています。"
            );
          } else {
            sendSignal({
              type: "viewer-ready"
            });

            setStatus(
              "受信準備ができました。\n" +
              "iPhone側の接続を待っています。"
            );
          }

          resolve();
        };

        socket.onmessage = async event => {
          try {
            const message = JSON.parse(event.data);
            await handleSignal(message);
          } catch (error) {
            console.error(error);
            setStatus("接続情報の処理中にエラーが発生しました。");
          }
        };

        socket.onerror = () => {
          reject(
            new Error("Cloudflareへの接続に失敗しました。")
          );
        };

        socket.onclose = () => {
          if (role !== null) {
            setStatus("Cloudflareとの接続が終了しました。");
          }
        };
      });
    }

    async function handleSignal(message) {
      if (message.type === "joined") {
        return;
      }

      if (message.type === "peer-joined") {
        if (role === "sender") {
          sendSignal({ type: "sender-ready" });
        } else if (role === "viewer") {
          sendSignal({ type: "viewer-ready" });
        }

        return;
      }

      if (
        message.type === "sender-ready" &&
        role === "viewer"
      ) {
        sendSignal({ type: "viewer-ready" });
        return;
      }

      if (
        message.type === "viewer-ready" &&
        role === "sender"
      ) {
        await createAndSendOffer();
        return;
      }

      if (
        message.type === "offer" &&
        role === "viewer"
      ) {
        await receiveOffer(message);
        return;
      }

      if (
        message.type === "answer" &&
        role === "sender"
      ) {
        await peerConnection.setRemoteDescription(
          message.answer
        );

        return;
      }

      if (message.type === "ice-candidate") {
        if (!peerConnection) {
          return;
        }

        try {
          await peerConnection.addIceCandidate(
            message.candidate
          );
        } catch (error) {
          console.error("ICE Candidate error:", error);
        }

        return;
      }

      if (message.type === "peer-left") {

  // 相手が接続を終了したため，

  stopAll(false);

    "相手側が接続を終了しました。\n" +
    "この端末側の接続も終了しました。"
  );

  return;
}
    }

    async function createAndSendOffer() {
      if (
        role !== "sender" ||
        !peerConnection ||
        offerStarted
      ) {
        return;
      }

      offerStarted = true;

      try {
        const offer =
          await peerConnection.createOffer();

        await peerConnection.setLocalDescription(offer);

        sendSignal({
          type: "offer",
          offer: peerConnection.localDescription
        });

        setStatus("パソコンとWebRTC接続を開始しています。");
      } catch (error) {
        offerStarted = false;
        throw error;
      }
    }

    async function receiveOffer(message) {
      if (!peerConnection) {
        createPeerConnection();

        peerConnection.addTransceiver("video", {
          direction: "recvonly"
        });

        peerConnection.addTransceiver("audio", {
          direction: "recvonly"
        });
      }

      await peerConnection.setRemoteDescription(
        message.offer
      );

      const answer =
        await peerConnection.createAnswer();

      await peerConnection.setLocalDescription(answer);

      sendSignal({
        type: "answer",
        answer: peerConnection.localDescription
      });

      setStatus("iPhoneからの映像を接続しています。");
    }

      /*
        ボタンの一時ロックを解除する
      */

      mobileFullscreenButtonLocked = false;

      if (mobileFullscreenLockTimer) {

        clearTimeout(
          mobileFullscreenLockTimer
        );

        mobileFullscreenLockTimer = null;
      }

      pcFullscreenButton.removeAttribute(
        "aria-disabled"
      );


      /*
        疑似全画面中なら，
        横向きになっても疑似全画面を維持する
      */

    if (isMobilePseudoFullscreen()) {

  videoWrapper.classList.add(
    "mobilePseudoFullscreen"
  );

  document.body.classList.add(
    "mobilePseudoFullscreenActive"
  );

  /*
    回転後の実際の表示領域へ合わせ直す
  */

  updateMobilePseudoFullscreenViewport();

  updateFullscreenIcon(true);

  hideMobileFullscreenButton();

  return;
}


      /*
        通常表示中も，
        アイコンを出しっぱなしにしない
      */

      updateFullscreenIcon(false);
      hideMobileFullscreenButton();
    },
    350
  );
}


window.addEventListener(
  "orientationchange",
  refreshMobileFullscreenAfterRotation
);


/*
  iPhone Safariではorientationchange以外に，
  resizeだけが発生する場合もある
*/

window.addEventListener(
  "resize",
  refreshMobileFullscreenAfterRotation
);

    /*
  iPhone版Chromeでブラウザバーやタブ表示により
  実際に見えている範囲が変化したときの補正
*/

if (window.visualViewport) {

  window.visualViewport.addEventListener(
    "resize",
    () => {

      if (isMobilePseudoFullscreen()) {
        updateMobilePseudoFullscreenViewport();
      }
    }
  );

  window.visualViewport.addEventListener(
    "scroll",
    () => {

      if (isMobilePseudoFullscreen()) {
        updateMobilePseudoFullscreenViewport();
      }
    }
  );
}

    window.addEventListener("beforeunload", () => {
      stopAll(false);
    });

    // ======================================
// 詳細設定の保存
// ======================================

function loadSettings() {

  const savedPcKey =
    localStorage.getItem("pcStopKey");

  if (savedPcKey !== null) {
    pcStopKey.value = savedPcKey;
  }

  const savedGesture =
    localStorage.getItem(
      "iphoneStopGesture"
    );

  if (savedGesture !== null) {
    iphoneStopGesture.value =
      savedGesture;
  }
}


function saveSettings() {

  localStorage.setItem(
    "pcStopKey",
    pcStopKey.value
  );

  localStorage.setItem(
    "iphoneStopGesture",
    iphoneStopGesture.value
  );
}


// ----------
// 変更されたら保存
// ----------

pcStopKey.addEventListener(
  "change",
  saveSettings
);

iphoneStopGesture.addEventListener(
  "change",
  saveSettings
);




// ----------
// 起動時に読み込み
// ----------

loadSettings();
    
  </script>
</body>
</html>
