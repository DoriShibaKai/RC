<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>WebRTCカメラ</title>
   
<style>
  * {
    box-sizing: border-box;
  }

  :root {
    color-scheme: dark;

    --page-bg: #050c1c;
    --panel-bg: rgba(12, 24, 48, 0.94);
    --panel-bg-light: rgba(20, 36, 67, 0.96);
    --border-color: rgba(148, 173, 220, 0.18);

    --text-main: #f7f9ff;
    --text-sub: #aab8d4;

    --blue-start: #5265ed;
    --blue-end: #3347c6;

    --green-start: #3e927b;
    --green-end: #246758;

    --gray-start: #33415f;
    --gray-end: #202c46;

    --danger-start: #f04444;
    --danger-end: #d7222c;

    --accent: #62df83;
  }

  body {
    min-height: 100vh;
    margin: 0;
    padding: 14px;
    background:
      radial-gradient(
        circle at top left,
        rgba(56, 81, 160, 0.25),
        transparent 38%
      ),
      linear-gradient(
        180deg,
        #050b18 0%,
        #071329 55%,
        #050b18 100%
      );
    color: var(--text-main);
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      "Hiragino Sans",
      "Yu Gothic",
      Meiryo,
      sans-serif;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    width: min(920px, 100%);
    margin: 0 auto;
  }

  /* ======================================
     上部ヘッダー
  ====================================== */

  .appHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
    padding: 4px 4px 2px;
  }

  .appTitleArea {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .cameraLogo {
    position: relative;
    display: grid;
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    place-items: center;
    border: 1px solid rgba(117, 155, 255, 0.28);
    border-radius: 50%;
    background:
      radial-gradient(
        circle,
        #5dd3ff 0 12%,
        #162447 13% 28%,
        #5874ff 29% 37%,
        #101b35 38% 58%,
        #223c72 59% 100%
      );
    box-shadow:
      0 0 24px rgba(68, 113, 255, 0.35),
      inset 0 0 12px rgba(255, 255, 255, 0.18);
  }

  .cameraLogo::after {
    content: "";
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    filter: blur(1px);
    transform: translate(-5px, -5px);
  }

  .appTitleText {
    min-width: 0;
  }

  h1 {
    margin: 0;
    font-size: clamp(20px, 3vw, 27px);
    line-height: 1.15;
    letter-spacing: 0.02em;
  }

  .appSubtitle {
    margin: 5px 0 0;
    color: var(--text-sub);
    font-size: 13px;
  }

  .headerBadge {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    padding: 9px 13px;
    border: 1px solid rgba(129, 157, 210, 0.22);
    border-radius: 999px;
    background: rgba(12, 24, 48, 0.72);
    color: #dbe6ff;
    font-size: 13px;
    font-weight: bold;
  }

  .headerBadgeDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(98, 223, 131, 0.8);
  }

  /* ======================================
     共通パネル
  ====================================== */

  .panel {
    position: relative;
    margin-bottom: 14px;
    padding: 15px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    border-radius: 17px;
    background:
      linear-gradient(
        145deg,
        rgba(17, 31, 59, 0.97),
        rgba(8, 19, 40, 0.98)
      );
    box-shadow:
      0 16px 38px rgba(0, 0, 0, 0.27),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .panel::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(
        110deg,
        rgba(255, 255, 255, 0.025),
        transparent 32%
      );
  }

  .panel > * {
    position: relative;
    z-index: 1;
  }

  /* ======================================
     部屋名入力
  ====================================== */

  .roomRow {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 12px;
  }

  .roomField {
    flex: 1;
    min-width: 0;
  }

  label {
    display: block;
    margin-bottom: 6px;
    color: #dce6fb;
    font-size: 14px;
    font-weight: bold;
  }

  input {
    width: 100%;
    min-height: 46px;
    margin: 0;
    padding: 10px 13px;
    border: 1px solid rgba(151, 177, 225, 0.32);
    border-radius: 10px;
    outline: none;
    background: rgba(3, 10, 25, 0.72);
    color: #ffffff;
    font-size: 16px;
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }

  input:focus {
    border-color: #6f8eff;
    box-shadow: 0 0 0 3px rgba(86, 119, 255, 0.18);
  }

  input:disabled {
    color: #9ca9c3;
    background: rgba(6, 13, 28, 0.5);
  }

  /* ======================================
     3つの操作ボタン
  ====================================== */

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

 .mainActionButton {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  min-width: 0;
  min-height: 72px;
  padding: 10px 12px;

  overflow: hidden;

  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 13px;

  color: #ffffff;
  cursor: pointer;

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    0 8px 19px rgba(0, 0, 0, 0.18);

  transition:
    transform 0.15s,
    filter 0.2s,
    box-shadow 0.2s;
}

  .mainActionButton:hover:not(:disabled) {
    filter: brightness(1.08);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 12px 24px rgba(0, 0, 0, 0.24);
  }

  .mainActionButton:active:not(:disabled) {
    transform: scale(0.98);
  }

 .mainActionIcon {
  position: absolute;
  left: calc(50% - 105px);

  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
}

/* ======================================
   PC用ボタン位置微調整
====================================== */

/* PCの「カメラ送信」ボタンの文字
   数字大きいと右へずれる */
#sendButton .mainActionText {
  transform: translateX(7px);
}

/* PCの「カメラ送信」ボタンのアイコン
   数字大きいと右へずれる */
#sendButton .mainActionIcon {
  transform: translateX(28px);
}

/* PCの「映像を受信」ボタンの文字
   数字大きいと右へずれる */
#viewButton .mainActionText {
  transform: translateX(11px);
}

/* PCの「映像を受信」ボタンのアイコン
   数字大きいと右へずれる */
#viewButton .mainActionIcon {
  transform: translateX(30px);
}

/* PCの「接続を終了」ボタンの文字
   数字大きいと右へずれる */
#stopButton .mainActionText {
  transform: translateX(9px);
}

/* PCの「接続を終了」ボタンのアイコン
   数字大きいと右へずれる */
#stopButton .mainActionIcon {
  transform: translateX(29px);
}

  .mainActionIcon svg {
    width: 29px;
    height: 29px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

 .mainActionText {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

  margin: 0;
   transform: translateX(10px);
}

.mainActionTitle {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.25;
  white-space: nowrap;
}

 

  .mainActionDescription {
    color: rgba(255, 255, 255, 0.72);
    font-size: 10px;
    font-weight: normal;
    line-height: 1.25;
  }

  #sendButton {
    background:
      linear-gradient(
        145deg,
        var(--blue-start),
        var(--blue-end)
      );
  }

  #viewButton {
    background:
      linear-gradient(
        145deg,
        var(--green-start),
        var(--green-end)
      );
  }

  #stopButton {
    margin: 0;
    background:
      linear-gradient(
        145deg,
        var(--gray-start),
        var(--gray-end)
      );
  }

  button:disabled {
    cursor: default;
    opacity: 0.48;
    filter: saturate(0.55);
  }

  .note {
    margin: 11px 1px 0;
    color: var(--text-sub);
    font-size: 15px;
     font-weight: 600;
    line-height: 1.55;
  }


  /* ======================================
     状態表示
  ====================================== */

 
.compactStatusRow {
  display: flex;
  align-items: flex-start;
  width: 100%;
  gap: 6px;
  margin: 0 0 6px;
}

#xyDisplay,
#driveStatus {
  display: block;

  box-sizing: border-box;
  min-height: 24px;
  margin: 0;
  padding: 3px 7px;

  border: 1px solid rgba(129, 157, 210, 0.16);
  border-radius: 8px;

  background: rgba(4, 12, 28, 0.72);
  color: #dce7ff;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size: 12px;
  line-height: 16px;
}

#xyDisplay {
  flex: 0 0 auto;
  white-space: nowrap;
}

#driveStatus {
  flex: 1 1 auto;
  min-width: 0;

  text-align: left;

  white-space: normal;
  overflow-wrap: anywhere;
}

.hiddenStatus {
  display: none;
}

/* hiddenクラスを付けた要素は完全に非表示 */
.hidden {
  display: none !important;
}

.connectionPanel {
  padding: 8px 10px 10px;
}

  /* ======================================
     映像領域
  ====================================== */

  #videoWrapper {
    position: relative;
    width: 100%;
    overflow: hidden;
    border: 1px solid rgba(140, 168, 220, 0.2);
    border-radius: 13px;
    background:
      radial-gradient(
        circle at center,
        #101b31,
        #01040b 72%
      );
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.025),
      0 10px 24px rgba(0, 0, 0, 0.24);
    
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* iPhone/Safariの長押しによる文字・画面選択を防ぐ */
  #videoWrapper,
  #videoWrapper * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #videoWrapper video {
    -webkit-user-drag: none;
  }

  video {
    display: block;
    width: 100%;
    max-height: 78vh;
    margin: 0;
    border-radius: 0;
    background: #000000;
    object-fit: contain;
  }

 /* ======================================
   映像の全画面ボタン
====================================== */

#pcFullscreenButton {
  position: absolute;
  right: 12px;
  bottom: 12px;

  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;

  margin: 0;
  padding: 0;

  z-index: 40;

  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: 9px;

  background: rgba(0, 0, 0, 0.58);
  color: #ffffff;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
  touch-action: manipulation;
}

#pcFullscreenButton:hover {
  background: rgba(0, 0, 0, 0.78);
}

#pcFullscreenButton svg {
  width: 24px;
  height: 24px;
  pointer-events: none;
}


/* ======================================
   本当の全画面表示
   PCなどの対応ブラウザ
====================================== */

#videoWrapper:fullscreen {
  width: 100vw;
  height: 100vh;

  border: none;
  border-radius: 0;

  background: #000000;
}

#videoWrapper:fullscreen video {
  width: 100%;
  height: 100%;
  max-height: none;

  border-radius: 0;
  object-fit: contain;
}

#videoWrapper:fullscreen #pcFullscreenButton {
  right: 18px;
  bottom: 18px;
}

  /*
  PC全画面でも，通常画面と同じSTOPボタンサイズを使用
*/
#videoWrapper:fullscreen #driveStopButton {
  left: var(--stop-button-left) !important;
  top: var(--stop-button-top) !important;

  width: var(--stop-button-width) !important;
  height: var(--stop-button-height) !important;

  min-width: 0 !important;
  min-height: 0 !important;
}

/* ======================================
   iPhone用：疑似全画面
====================================== */

body.mobilePseudoFullscreenActive {
  overflow: hidden;
}

#videoWrapper.mobilePseudoFullscreen {
  position: fixed;

  /*
    iPhone版Chromeでは，
    JavaScriptで実際に見えている画面範囲を入れる
  */

  left: var(--mobile-viewport-left, 0px);
  top: var(--mobile-viewport-top, 0px);

  width: var(--mobile-viewport-width, 100vw);
  height: var(--mobile-viewport-height, 100dvh);

  z-index: 2000;

  margin: 0;
  padding: 0;

  border: none;
  border-radius: 0;

  background: #000000;
}

#videoWrapper.mobilePseudoFullscreen video {
  width: 100%;
  height: 100%;
  max-height: none;

  border-radius: 0;
  object-fit: contain;
}

#videoWrapper.mobilePseudoFullscreen #pcFullscreenButton {
  right: max(12px, env(safe-area-inset-right));
  bottom: max(12px, env(safe-area-inset-bottom));
}


/* ======================================
   iPhone・小さい画面
====================================== */

@media (max-width: 700px), (pointer: coarse) {

  /* 通常は全画面アイコンを隠す */
  #pcFullscreenButton {
    display: none;

    width: 50px;
    height: 50px;
    min-width: 50px;
    min-height: 50px;

    right: 10px;
    bottom: 10px;
  }

  /* 右下を3秒長押ししたときだけ表示 */
  #pcFullscreenButton.mobileFullscreenVisible {
    display: flex;
  }
}


/* さらに小さい画面 */

@media (max-width: 370px) {

  #pcFullscreenButton {
    width: 46px;
    height: 46px;
    min-width: 46px;
    min-height: 46px;

    right: 8px;
    bottom: 8px;
  }
}

  /* ======================================
     映像上のSTOPボタン
  ====================================== */

  #driveStopButton {
  position: absolute;

  left: var(--stop-button-left, 68%);
  top: var(--stop-button-top, 4%);

  width: var(--stop-button-width, 180px);
  height: var(--stop-button-height, 72px);

  min-width: 0;
  min-height: 0;

  margin: 0;
  padding: 8px 15px;

  z-index: 30;

  /* 画像のような細い明るい縁 */
  border: 1px solid rgba(255, 255, 255, 0.7);

  /* 角を丸くする */
  border-radius: 10px;

  /* 明るい赤のグラデーション */
  background:
    linear-gradient(
      145deg,
      #f45151 0%,
      #e5363e 55%,
      #d92732 100%
    );

  color: #ffffff;

  font-size: 16px;
  font-weight: bold;

  /* 画像に近い控えめな影 */
  box-shadow:
    0 5px 12px rgba(90, 0, 8, 0.32),
    inset 0 1px 0 rgba(255, 255, 255, 0.28);

  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* STOP文字の左側にある白い四角 */
#driveStopButton::before {
  content: "";
  display: inline-block;

  width: 12px;
  height: 12px;
  flex-shrink: 0;

  margin-right: 7px;

  border-radius: 2px;
  background: #ffffff;
}

/* 使用できない状態でも白い四角を薄くしない */
#driveStopButton:disabled::before {
  opacity: 1;
}
  #driveStopButtonText {
    pointer-events: none;
  }

  #stopResizeHandle {
    display: none;
    position: absolute;
    right: 2px;
    bottom: 0;
    width: 32px;
    height: 32px;
    align-items: center;
    justify-content: center;
    border-radius: 8px 0 8px 0;
    background: rgba(0, 0, 0, 0.48);
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
    cursor: nwse-resize;
    touch-action: none;
  }

  /* ======================================
     ジョイスティック
  ====================================== */

  #joystickArea {
    position: absolute;
    left: 0;
    top: 0;
    display: none;
    width: 140px;
    height: 140px;
    transform: translate(-50%, -50%);
    z-index: 10;
    border: 2px solid rgba(255, 255, 255, 0.42);
    border-radius: 50%;
    background: rgba(8, 18, 38, 0.3);
    box-shadow:
      0 0 0 8px rgba(0, 0, 0, 0.08),
      inset 0 0 25px rgba(255, 255, 255, 0.08);
  }

  #joystickKnob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 50px;
    height: 50px;
    margin-left: -25px;
    margin-top: -25px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.82);
    box-shadow: 0 4px 13px rgba(0, 0, 0, 0.35);
  }

/*
  右下長押し専用のサイン。
  ジョイスティックとは別の表示として使用する。
*/
#fullscreenHoldIndicator {
  position: absolute;
  left: 0;
  top: 0;

  display: none;
  width: 76px;
  height: 76px;
  transform: translate(-50%, -50%);

  z-index: 35;
  pointer-events: none;

  align-items: center;
  justify-content: center;
  flex-direction: column;

  border: 3px solid rgba(120, 210, 255, 0.95);
  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(5, 18, 38, 0.82) 0 52%,
      rgba(40, 145, 220, 0.32) 53% 100%
    );

  color: #ffffff;

  box-shadow:
    0 0 0 5px rgba(60, 170, 255, 0.15),
    0 0 24px rgba(60, 170, 255, 0.5);
}

#fullscreenHoldIndicator .fullscreenHoldSymbol {
  font-size: 29px;
  line-height: 1;
}

#fullscreenHoldIndicator .fullscreenHoldLabel {
  margin-top: 3px;
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 0.05em;
}

/*
  400ミリ秒たつと，3秒成立まで黄色へ変化する。
*/
#fullscreenHoldIndicator.fullscreenHoldProgress {
  display: flex;

  animation:
    fullscreenHoldProgressColor 2.6s linear forwards;
}

@keyframes fullscreenHoldProgressColor {
  0% {
    border-color: rgba(120, 210, 255, 0.95);
    box-shadow:
      0 0 0 5px rgba(60, 170, 255, 0.15),
      0 0 24px rgba(60, 170, 255, 0.5);
  }

  100% {
    border-color: rgba(255, 183, 0, 1);
    background:
      radial-gradient(
        circle,
        rgba(44, 28, 0, 0.88) 0 52%,
        rgba(255, 190, 35, 0.5) 53% 100%
      );
    box-shadow:
      0 0 0 8px rgba(255, 190, 0, 0.2),
      0 0 32px rgba(255, 190, 0, 0.65);
  }
}

/*
  3秒長押しが成立した瞬間の完了表示。
*/
#fullscreenHoldIndicator.fullscreenHoldCompleted {
  display: flex;
  animation: fullscreenHoldIndicatorPopOut 0.18s ease-out forwards;
}

@keyframes fullscreenHoldIndicatorPopOut {
  0% {
    opacity: 1;
    filter: brightness(1);
  }

  35% {
    opacity: 1;
    filter: brightness(1.8);
  }

  100% {
    opacity: 0;
    filter: brightness(1.2);
  }
}

/* ======================================
   STOPボタン編集中
====================================== */

/* 編集中は映像を薄くする */
#videoWrapper.stopButtonEditing video {
  opacity: 0.48;
  filter: grayscale(35%);
  pointer-events: none;
}

/* 編集中のSTOPボタン */
#videoWrapper.stopButtonEditing #driveStopButton {
  opacity: 1;
  filter: none;
  cursor: move;
  touch-action: none;

  border: 3px dashed #ffffff;

  box-shadow:
    0 0 0 3px rgba(87, 119, 255, 0.9),
    0 7px 18px rgba(0, 0, 0, 0.46);
}

/* 右下のサイズ変更ハンドル */
#videoWrapper.stopButtonEditing #stopResizeHandle {
  display: flex;
  cursor: nwse-resize;
  touch-action: none;
}
  /* ======================================
     スマートフォン
  ====================================== */

  @media (max-width: 700px) {
    body {
      padding: 8px;
    }

    .appHeader {
      margin-bottom: 9px;
      padding: 2px;
    }

    .cameraLogo {
      width: 40px;
      height: 40px;
    }

    h1 {
      font-size: 19px;
    }

    .appSubtitle {
      font-size: 10px;
    }

    .headerBadge {
      padding: 7px 9px;
      font-size: 11px;
    }

    .panel {
      margin-bottom: 9px;
      padding: 10px;
      border-radius: 13px;
    }

    .roomRow {
      margin-bottom: 9px;
    }

    input {
      min-height: 40px;
      padding: 8px 10px;
      font-size: 14px;
    }

    label {
      margin-bottom: 4px;
      font-size: 11px;
    }

    .buttons {
      gap: 6px;
    }

    .mainActionButton {
  min-height: 62px;
  padding: 7px 5px;
  border-radius: 10px;
}

   /* ======================================
   iPhone用ボタン位置調整
====================================== */

/*
  3ボタン全体の位置調整

  数字を大きくすると右へ移動

/* 詳細設定の見出し */
#settingsPanel summary {
  display: flex;
  align-items: center;
  min-height: 54px;
  padding: 0 18px;
  border: 0;
  background:
    linear-gradient(
      145deg,
      rgba(32, 59, 106, 0.98),

    );
  color: #ffffff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  list-style: none;
}

#settingsPanel summary::-webkit-details-marker {
  display: none;
}

#settingsPanel summary::before {
  content: "";
  width: 21px;
  height: 21px;
  margin-right: 11px;
  background:
    linear-gradient(#d6e2ff, #d6e2ff) 2px 5px / 16px 2px no-repeat,
    linear-gradient(#d6e2ff, #d6e2ff) 2px 13px / 16px 2px no-repeat,
    radial-gradient(circle, #ffffff 0 2px, transparent 2.5px)
      5px 6px / 7px 7px no-repeat,
    radial-gradient(circle, #ffffff 0 2px, transparent 2.5px)
      11px 14px / 7px 7px no-repeat;
}

#settingsPanel summary::after {
  content: "⌄";
  margin-left: auto;
  color: #d6e2ff;
  font-size: 18px;
  line-height: 1;
  transition: transform 0.2s;
}

#settingsPanel[open] summary {
  border-bottom: 1px solid rgba(135, 167, 225, 0.24);
}

#settingsPanel[open] summary::after {
  transform: rotate(180deg);
}

/* 詳細設定の中全体 */
.settingsContent {
  display: flex;
  flex-direction: column;
  gap: 11px;
  padding: 12px;
  background: rgba(3, 11, 27, 0.72);
}

   詳細設定内の機能グループ
====================================== */

.settingsGroup {
  margin: 0;
  padding: 0;
  border: 0;
}

.settingsGroup + .settingsGroup {
  margin-top: 7px;
}


/* STOP設定・背景設定の見出し */

/* 同じ設定グループ内のカード */

}


/* グループ下の補足 */
.settingsGroupNote {

  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
}


/* ======================================
   背景設定のトグル
====================================== */

.themeToggleControl {
  grid-column: 3;
  grid-row: 1 / 3;

  display: flex;
  align-items: center;
  justify-self: center;
  gap: 10px;

  margin: 0;
  cursor: pointer;
}


/* 実際のチェックボックスを画面外へ隠す */
.themeToggleControl input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}


/* トグル本体 */
.themeToggleSwitch {
  position: relative;

  display: block;
  width: 54px;
  height: 30px;
  flex-shrink: 0;

  border: 1px solid rgba(160, 182, 225, 0.36);
  border-radius: 999px;

  background: #273958;

  box-shadow:
    inset 0 2px 5px rgba(0, 0, 0, 0.28),
    0 2px 6px rgba(0, 0, 0, 0.15);

  transition:
    background 0.2s,
    border-color 0.2s;
}


/* トグルの丸 */
.themeToggleSwitch::after {
  content: "";

  position: absolute;
  left: 3px;
  top: 3px;

  width: 22px;
  height: 22px;

  border-radius: 50%;
  background: #ffffff;

  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.32);

  transition: transform 0.2s;
}


/* 将来ONになったときの見た目 */
.themeToggleControl input:checked +
.themeToggleSwitch {
  border-color: rgba(103, 141, 255, 0.8);
  background: #5265ed;
}

.themeToggleControl input:checked +
.themeToggleSwitch::after {
  transform: translateX(24px);
}


/* ダークなどの表示文字 */
.themeToggleText {
  min-width: 52px;

  color: #e8efff;
  font-size: 15px;
  font-weight: bold;
}


/* 今は準備中なので少し薄く表示 */
.themeToggleControl:has(input:disabled) {
  cursor: default;
  opacity: 0.58;
}

  position: relative;

  grid-template-columns:
    56px

    function sendSignal(data) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        return;
      }

      socket.send(JSON.stringify(data));
    }

    function connectWebSocket(roomName) {
      return new Promise((resolve, reject) => {
        const protocol =
          location.protocol === "https:" ? "wss:" : "ws:";

        const socketUrl =
          protocol +
          "//" +
          location.host +
          "/ws/" +
          encodeURIComponent(roomName);

        socket = new WebSocket(socketUrl);

        socket.onopen = () => {
          sendSignal({
            type: "role",
            role
          });

          if (role === "sender") {
            sendSignal({
              type: "sender-ready"
            });

            setStatus(
              "カメラを準備しました。\n" +
              "パソコン側の接続を待っています。"
            );
          } else {
            sendSignal({
              type: "viewer-ready"
            });

            setStatus(
              "受信準備ができました。\n" +
              "iPhone側の接続を待っています。"
            );
          }

          resolve();
        };

        socket.onmessage = async event => {
          try {
            const message = JSON.parse(event.data);
            await handleSignal(message);
          } catch (error) {
            console.error(error);
            setStatus("接続情報の処理中にエラーが発生しました。");
          }
        };

        socket.onerror = () => {
          reject(
            new Error("Cloudflareへの接続に失敗しました。")
          );
        };

        socket.onclose = () => {
          if (role !== null) {
            setStatus("Cloudflareとの接続が終了しました。");
          }
        };
      });
    }

    async function handleSignal(message) {
      if (message.type === "joined") {
        return;
      }

      if (message.type === "peer-joined") {
        if (role === "sender") {
          sendSignal({ type: "sender-ready" });
        } else if (role === "viewer") {
          sendSignal({ type: "viewer-ready" });
        }

        return;
      }

      if (
        message.type === "sender-ready" &&
        role === "viewer"
      ) {
        sendSignal({ type: "viewer-ready" });
        return;
      }

      if (
        message.type === "viewer-ready" &&
        role === "sender"
      ) {
        await createAndSendOffer();
        return;
      }

      if (
        message.type === "offer" &&
        role === "viewer"
      ) {
        await receiveOffer(message);
        return;
      }

      if (
        message.type === "answer" &&
        role === "sender"
      ) {
        await peerConnection.setRemoteDescription(
          message.answer
        );

        return;
      }

      if (message.type === "ice-candidate") {
        if (!peerConnection) {
          return;
        }

        try {
          await peerConnection.addIceCandidate(
            message.candidate
          );
        } catch (error) {
          console.error("ICE Candidate error:", error);
        }

        return;
      }

      if (message.type === "peer-left") {

  // 相手が接続を終了したため，
  // この端末側の映像・通信・操作も終了する
  stopAll(false);

  setStatus(
    "相手側が接続を終了しました。\n" +
    "この端末側の接続も終了しました。"
  );

  return;
}
    }

    async function createAndSendOffer() {
      if (
        role !== "sender" ||
        !peerConnection ||
        offerStarted
      ) {
        return;
      }

      offerStarted = true;

      try {
        const offer =
          await peerConnection.createOffer();

        await peerConnection.setLocalDescription(offer);

        sendSignal({
          type: "offer",
          offer: peerConnection.localDescription
        });

        setStatus("パソコンとWebRTC接続を開始しています。");
      } catch (error) {
        offerStarted = false;
        throw error;
      }
    }

    async function receiveOffer(message) {
      if (!peerConnection) {
        createPeerConnection();

        peerConnection.addTransceiver("video", {
          direction: "recvonly"
        });

        peerConnection.addTransceiver("audio", {
          direction: "recvonly"
        });
      }

      await peerConnection.setRemoteDescription(
        message.offer
      );

      const answer =
        await peerConnection.createAnswer();

      await peerConnection.setLocalDescription(answer);

      sendSignal({
        type: "answer",
        answer: peerConnection.localDescription
      });

      setStatus("iPhoneからの映像を接続しています。");
    }

  1. iPhoneなどでは，送信側・受信側のどちらでも
     右下長押しによる全画面アイコン表示を開始する。
  2. 受信側だけは，これとは別にジョイスティック候補を開始する。
*/
videoWrapper.addEventListener(
  "pointerdown",
  event => {

    if (
      settingsPanel.open ||
      stopEditorActive
    ) {
      return;
    }

    /*
      STOPボタンや全画面ボタン自体を押した場合は，
      長押し判定とジョイスティックを開始しない。
    */
    if (
      event.target.closest(
        "#driveStopButton, #pcFullscreenButton"
      )
    ) {
      return;
    }

    /*
      送信側・受信側のどちらでも，
      iPhoneの右下長押し判定を開始できる。
    */
    startMobileFullscreenHold(event);

    /*
      ジョイスティックは受信側だけで使用する。
    */
    if (
      role !== "viewer" ||
      driveStopped
    ) {
      return;
    }

    /* すでに別の指を追跡している場合は無視する */
    if (joystickPointerId !== null) {
      return;
    }

    if (
      event.pointerType === "touch" ||
      event.pointerType === "pen"
    ) {
      event.preventDefault();
    }

    const rect =
      videoWrapper.getBoundingClientRect();

    const pointerX =
      event.clientX - rect.left;

    const pointerY =
      event.clientY - rect.top;

    /* ジョイスティックの中心位置を映像枠内に収める */
    joystickCenterX = Math.max(
      joystickRadius,
      Math.min(
        rect.width - joystickRadius,
        pointerX
      )
    );

    joystickCenterY = Math.max(
      joystickRadius,
      Math.min(
        rect.height - joystickRadius,
        pointerY
      )
    );

    joystickPointerId = event.pointerId;
    joystickPointerStartX = event.clientX;
    joystickPointerStartY = event.clientY;

    joystickCandidate = true;
    joystickActive = false;

    joystickKnob.style.left = "50%";
    joystickKnob.style.top = "50%";

    xyDisplay.textContent = "X：0.00　Y：0.00";

    joystickArea.style.left =
      joystickCenterX + "px";

    joystickArea.style.top =

        event.pointerId
      );

    */

      Math.hypot(
        event.clientX - joystickPointerStartX,
        event.clientY - joystickPointerStartY
      );


    /*
      12px未満は手指の揺れとして扱う
    */

    if (
      !joystickActive &&
      movementFromStart <

    ) {

    */

      videoWrapper.getBoundingClientRect();

      event.clientX - rect.left;

    const pointerY =
      event.clientY - rect.top;

    let dx =
      pointerX - joystickCenterX;

    let dy =
      pointerY - joystickCenterY;

    const distance =
      Math.hypot(dx, dy);


    /*
      ノブが外周を越えないようにする
    */

    if (distance > maxKnobDistance) {

      dx =
        dx / distance *
        maxKnobDistance;

      dy =
        dy / distance *
        maxKnobDistance;
    }


    joystickKnob.style.left =
      (joystickRadius + dx) + "px";

    joystickKnob.style.top =
      (joystickRadius + dy) + "px";


    const x =
      dx / maxKnobDistance;

    const y =
      -dy / maxKnobDistance;


    xyDisplay.textContent =
      "X：" + x.toFixed(2) +
      "　Y：" + y.toFixed(2);


    if (
      driveChannel &&
      driveChannel.readyState === "open"
    ) {

      driveSequence++;

      const driveData = {
        type: "drive",
        x: Number(x.toFixed(2)),
        y: Number(y.toFixed(2)),
        sequence: driveSequence
      };

      driveChannel.send(

const STOP_GEOMETRY_STORAGE_KEY =
  "driveStopButtonGeometryV2";

/*
  幅・高さはpxで保存する。
  xRatio・yRatioは，ボタンが移動できる範囲内での位置。
  0 = 左端・上端
  1 = 右端・下端
*/
let stopButtonGeometry = {
  xRatio: 0.94,
  yRatio: 0.05,
  widthPx: 180,
  heightPx: 72
};

let videoWasPlayingBeforeStopEdit = false;


/*
  数値を指定範囲内へ収める
*/
function clampStopEditValue(
  value,
  minimum,
  maximum
) {
  return Math.min(
    maximum,
    Math.max(minimum, value)
  );
}


/*
  保存されている大きさと位置を画面へ反映する
*/
function applyStopButtonGeometry() {

  const wrapperRect =
    videoWrapper.getBoundingClientRect();

  if (
    wrapperRect.width <= 0 ||
    wrapperRect.height <= 0
  ) {
    return;
  }

  /*
    保存サイズが現在の画面より大きい場合だけ，
    画面内へ収まるサイズに補正する
  */
  const widthPx =
    clampStopEditValue(
      stopButtonGeometry.widthPx,
      Math.min(78, wrapperRect.width),
      wrapperRect.width
    );

  const heightPx =
    clampStopEditValue(
      stopButtonGeometry.heightPx,
      Math.min(44, wrapperRect.height),
      wrapperRect.height
    );

  /*
    ボタン左上が移動できる最大距離
  */
  const movableWidth =
    Math.max(
      0,
      wrapperRect.width - widthPx
    );

  const movableHeight =
    Math.max(
      0,
      wrapperRect.height - heightPx
    );

  const leftPx =
    movableWidth *
    clampStopEditValue(
      stopButtonGeometry.xRatio,
      0,
      1
    );

  const topPx =
    movableHeight *
    clampStopEditValue(
      stopButtonGeometry.yRatio,
      0,
      1
    );

  /*
  通常画面・全画面の両方へ，
  同じ位置とpxサイズをCSS変数として反映する
*/
videoWrapper.style.setProperty(
  "--stop-button-left",
  `${leftPx}px`
);

videoWrapper.style.setProperty(
  "--stop-button-top",
  `${topPx}px`
);

videoWrapper.style.setProperty(
  "--stop-button-width",
  `${widthPx}px`
);

videoWrapper.style.setProperty(
  "--stop-button-height",
  `${heightPx}px`
);


/*
  以前の直接指定が残っている場合に備えて解除する
*/
driveStopButton.style.removeProperty("left");
driveStopButton.style.removeProperty("top");
driveStopButton.style.removeProperty("width");
driveStopButton.style.removeProperty("height");
}


/*
  レイアウト変更が完了したあとに再反映する
*/
function scheduleStopButtonGeometryApply() {

  requestAnimationFrame(
    () => {

      requestAnimationFrame(
        applyStopButtonGeometry
      );
    }
  );

  setTimeout(
    applyStopButtonGeometry,
    100
  );

  setTimeout(
    applyStopButtonGeometry,
    300
  );
}


/*
  位置・サイズをブラウザへ保存する
*/
function saveStopButtonGeometry() {

  localStorage.setItem(
    STOP_GEOMETRY_STORAGE_KEY,
    JSON.stringify(stopButtonGeometry)
  );
}


/*
  保存済みの位置・サイズを読み込む
*/
function loadStopButtonGeometry() {

  const saved =
    localStorage.getItem(
      STOP_GEOMETRY_STORAGE_KEY
    );

  if (saved) {

    try {

      const parsed =
        JSON.parse(saved);

      if (
        Number.isFinite(parsed.xRatio) &&
        Number.isFinite(parsed.yRatio) &&
        Number.isFinite(parsed.widthPx) &&
        Number.isFinite(parsed.heightPx)
      ) {
        stopButtonGeometry = {
          xRatio:
            clampStopEditValue(
              parsed.xRatio,
              0,
              1
            ),

          yRatio:
            clampStopEditValue(
              parsed.yRatio,
              0,
              1
            ),

          widthPx:
            Math.max(
              78,
              parsed.widthPx
            ),

          heightPx:
            Math.max(
              44,
              parsed.heightPx
            )
        };
      }

    } catch (error) {

      console.error(
        "STOPボタン設定の読み込みに失敗しました。",
        error
      );
    }
  }

  scheduleStopButtonGeometryApply();
}

const mobileFullscreenMedia =
  window.matchMedia("(max-width: 700px)");

const mobileCoarsePointerMedia =
  window.matchMedia("(pointer: coarse)");

/*
  スマートフォンの右下長押し判定。
  ジョイスティックとは独立して管理する。
*/
let mobileFullscreenHoldTimer = null;
let mobileFullscreenColorTimer = null;
let mobileFullscreenHoldPointerId = null;
let mobileFullscreenHoldStartX = 0;
let mobileFullscreenHoldStartY = 0;
let mobileFullscreenHoldTriggered = false;

let mobileFullscreenHideTimer = null;


/*
  右下を3秒間押し続けると，
  全画面アイコンを表示する
*/

const MOBILE_FULLSCREEN_HOLD_MS = 3000;

/*
  400ミリ秒以上，ほぼ動かずに押し続けた場合だけ，
  長押し候補として黄色への変化を開始する
*/
const MOBILE_FULLSCREEN_COLOR_DELAY_MS = 400;

const MOBILE_FULLSCREEN_ZONE_SIZE_PX = 120;
const MOBILE_FULLSCREEN_VISIBLE_MS = 4000;

/* アイコン表示直後の誤操作防止時間 */
const MOBILE_FULLSCREEN_LOCK_MS = 1000;

let mobileFullscreenButtonLocked = false;
let mobileFullscreenLockTimer = null;


/*
  iPhoneなどの画面幅かどうか
*/

function isMobileFullscreenLayout() {

  return (
    mobileFullscreenMedia.matches ||
    mobileCoarsePointerMedia.matches ||
    navigator.maxTouchPoints > 0
  );
}


/*
  右下長押し専用サインを消す
*/
function hideFullscreenHoldIndicator() {
  fullscreenHoldIndicator.style.display = "none";
  fullscreenHoldIndicator.classList.remove(
    "fullscreenHoldProgress",
    "fullscreenHoldCompleted"
  );
  fullscreenHoldIndicator.style.opacity = "1";
  fullscreenHoldIndicator.style.filter = "";
}


/*
  右下長押し判定を中止する
*/
function cancelMobileFullscreenHold() {
  if (mobileFullscreenColorTimer) {
    clearTimeout(mobileFullscreenColorTimer);
    mobileFullscreenColorTimer = null;
  }

  if (mobileFullscreenHoldTimer) {
    clearTimeout(mobileFullscreenHoldTimer);
    mobileFullscreenHoldTimer = null;
  }

  mobileFullscreenHoldPointerId = null;
  mobileFullscreenHoldTriggered = false;
  hideFullscreenHoldIndicator();
}


/*
  送信側・受信側のどちらでも，
  右下長押しによる全画面アイコン表示を開始する
*/
function startMobileFullscreenHold(event) {
  if (
    !isMobileFullscreenLayout() ||
    role === null
  ) {
    return;
  }

  const rect =
    videoWrapper.getBoundingClientRect();

  const pointerX =
    event.clientX - rect.left;

  const pointerY =
    event.clientY - rect.top;

  const insideFullscreenHoldZone =
    pointerX >=
      rect.width - MOBILE_FULLSCREEN_ZONE_SIZE_PX &&
    pointerY >=
      rect.height - MOBILE_FULLSCREEN_ZONE_SIZE_PX;

  if (!insideFullscreenHoldZone) {
    return;
  }

  cancelMobileFullscreenHold();

  mobileFullscreenHoldPointerId =
    event.pointerId;

  mobileFullscreenHoldStartX =
    event.clientX;

  mobileFullscreenHoldStartY =
    event.clientY;

  fullscreenHoldIndicator.style.left =
    pointerX + "px";

  fullscreenHoldIndicator.style.top =
    pointerY + "px";

  fullscreenHoldIndicator.style.display =
    "flex";

  mobileFullscreenColorTimer = setTimeout(
    () => {
      mobileFullscreenColorTimer = null;

      if (
        mobileFullscreenHoldPointerId !==
          event.pointerId
      ) {
        return;
      }

      fullscreenHoldIndicator.classList.add(
        "fullscreenHoldProgress"
      );
    },
    MOBILE_FULLSCREEN_COLOR_DELAY_MS
  );

  mobileFullscreenHoldTimer = setTimeout(
    () => {
      mobileFullscreenHoldTimer = null;

      if (
        mobileFullscreenHoldPointerId !==
          event.pointerId
      ) {
        return;
      }

      mobileFullscreenHoldTriggered = true;

      fullscreenHoldIndicator.classList.add(
        "fullscreenHoldCompleted"
      );

      setTimeout(
        () => {
          hideFullscreenHoldIndicator();
          showMobileFullscreenButton();
        },
        180
      );
    },
    MOBILE_FULLSCREEN_HOLD_MS
  );
}


videoWrapper.addEventListener(
  "pointermove",
  event => {
    if (
      mobileFullscreenHoldPointerId !==
        event.pointerId ||
      mobileFullscreenHoldTriggered
    ) {
      return;
    }

    const movement =
      Math.hypot(
        event.clientX -
          mobileFullscreenHoldStartX,
        event.clientY -
          mobileFullscreenHoldStartY
      );

    if (
      movement >=
        JOYSTICK_START_DISTANCE_PX
    ) {
      cancelMobileFullscreenHold();
    }
  }
);


function finishMobileFullscreenHold(event) {
  if (
    mobileFullscreenHoldPointerId !==
      event.pointerId
  ) {
    return;
  }

  if (!mobileFullscreenHoldTriggered) {
    cancelMobileFullscreenHold();
    return;
  }

  mobileFullscreenHoldPointerId = null;
}


videoWrapper.addEventListener(
  "pointerup",
  finishMobileFullscreenHold
);

videoWrapper.addEventListener(
  "pointercancel",
  finishMobileFullscreenHold
);


/*
  iPhone用の疑似全画面中かどうか
*/

function isMobilePseudoFullscreen() {
  return videoWrapper.classList.contains(
    "mobilePseudoFullscreen"
  );
}


/*
  全画面アイコンの表示を更新
*/

function updateFullscreenIcon(isFullscreen) {

  if (isFullscreen) {

    pcFullscreenButton.title =
      "全画面表示を終了";

    pcFullscreenButton.setAttribute(
      "aria-label",
      "全画面表示を終了"
    );

    pcFullscreenIcon.innerHTML = `
      <path
        d="
          M9 4V9H4
          M20 9H15V4
          M15 20V15H20
          M4 15H9V20
        "
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    `;

  } else {

    pcFullscreenButton.title =
      "全画面表示";

    pcFullscreenButton.setAttribute(
      "aria-label",
      "映像を全画面表示"
    );

    pcFullscreenIcon.innerHTML = `
      <path
        d="
          M4 9V4H9
          M15 4H20V9
          M20 15V20H15
          M9 20H4V15
        "
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    `;
  }
}


/*
  iPhone用の全画面アイコンを隠す
*/

function hideMobileFullscreenButton() {

  if (mobileFullscreenHideTimer) {
    clearTimeout(mobileFullscreenHideTimer);
    mobileFullscreenHideTimer = null;
  }

  pcFullscreenButton.classList.remove(
    "mobileFullscreenVisible"
  );
}


/*
  iPhone用の全画面アイコンを数秒だけ表示
*/

function showMobileFullscreenButton() {

  if (!isMobileFullscreenLayout()) {
    return;
  }

  /*
    表示直後は，連続タップがそのまま
    全画面ボタンに当たらないようロックする
  */

  mobileFullscreenButtonLocked = true;

  pcFullscreenButton.classList.add(
    "mobileFullscreenVisible"
  );

  pcFullscreenButton.setAttribute(
    "aria-disabled",
    "true"
  );

  if (mobileFullscreenLockTimer) {
    clearTimeout(mobileFullscreenLockTimer);
  }

  mobileFullscreenLockTimer = setTimeout(
    () => {

      mobileFullscreenButtonLocked = false;

      pcFullscreenButton.removeAttribute(
        "aria-disabled"
      );

      mobileFullscreenLockTimer = null;
    },
    MOBILE_FULLSCREEN_LOCK_MS
  );


  /*
    数秒後に全画面アイコンを隠す
  */

  if (mobileFullscreenHideTimer) {
    clearTimeout(mobileFullscreenHideTimer);
  }

  mobileFullscreenHideTimer = setTimeout(
    hideMobileFullscreenButton,
    MOBILE_FULLSCREEN_VISIBLE_MS
  );
}


/*
  全画面へ入る直前に
  現在のSTOPボタン設定を保存する
*/
function preserveStopButtonSize() {
  saveStopButtonGeometry();
}


/*
  通常画面へ戻ったあとの
  videoWrapperサイズで再配置する
*/
function restoreStopButtonSize() {
  scheduleStopButtonGeometryApply();
}

/*
  iPhone用の疑似全画面を開始
*/

/*
  iPhone版Chromeを含むモバイルブラウザで，
  疑似全画面を実際に見えている範囲へ合わせる
*/

function updateMobilePseudoFullscreenViewport() {

  /*
    visualViewportが使える場合は，
    ブラウザ内で現在実際に見えている範囲を使う
  */

  if (window.visualViewport) {

    const viewport = window.visualViewport;

    videoWrapper.style.setProperty(
      "--mobile-viewport-left",
      `${viewport.offsetLeft}px`
    );

    videoWrapper.style.setProperty(
      "--mobile-viewport-top",
      `${viewport.offsetTop}px`
    );

    videoWrapper.style.setProperty(
      "--mobile-viewport-width",
      `${viewport.width}px`
    );

    videoWrapper.style.setProperty(
      "--mobile-viewport-height",
      `${viewport.height}px`
    );

    return;
  }


  /*
    visualViewportがないブラウザ用
  */

  videoWrapper.style.setProperty(
    "--mobile-viewport-left",
    "0px"
  );

  videoWrapper.style.setProperty(
    "--mobile-viewport-top",
    "0px"
  );

  videoWrapper.style.setProperty(
    "--mobile-viewport-width",
    `${window.innerWidth}px`
  );

  videoWrapper.style.setProperty(
    "--mobile-viewport-height",
    `${window.innerHeight}px`
  );
}
    
function enterMobilePseudoFullscreen() {

  preserveStopButtonSize();

  /*
    疑似全画面にする前に，
    現在見えている画面サイズを取得する
  */

  updateMobilePseudoFullscreenViewport();

  videoWrapper.classList.add(
    "mobilePseudoFullscreen"
  );

  document.body.classList.add(
    "mobilePseudoFullscreenActive"
  );

  updateFullscreenIcon(true);


  /*
    Chromeでは疑似全画面へ切り替えた直後に
    表示領域が変化することがあるため再取得する
  */

  requestAnimationFrame(
    updateMobilePseudoFullscreenViewport
  );

  setTimeout(
    updateMobilePseudoFullscreenViewport,
    150
  );

  setTimeout(
    updateMobilePseudoFullscreenViewport,
    400
  );
}


/*
  iPhone用の疑似全画面を終了
*/

function exitMobilePseudoFullscreen() {

  videoWrapper.classList.remove(
    "mobilePseudoFullscreen"
  );

  document.body.classList.remove(
    "mobilePseudoFullscreenActive"
  );


  /*
    疑似全画面用に設定した画面サイズを解除する
  */

  videoWrapper.style.removeProperty(
    "--mobile-viewport-left"
  );

  videoWrapper.style.removeProperty(
    "--mobile-viewport-top"
  );

  videoWrapper.style.removeProperty(
    "--mobile-viewport-width"
  );

  videoWrapper.style.removeProperty(
    "--mobile-viewport-height"
  );


  restoreStopButtonSize();
  updateFullscreenIcon(false);
}


/*
  全画面と通常表示を切り替える
*/

async function togglePcFullscreen() {

  try {

    /*
      iPhone用の疑似全画面から戻す
    */

    if (isMobilePseudoFullscreen()) {
      exitMobilePseudoFullscreen();
      hideMobileFullscreenButton();
      return;
    }


    /*
      本当の全画面表示中なら戻す
    */

    if (
      document.fullscreenElement ===
      videoWrapper
    ) {
      await document.exitFullscreen();
      hideMobileFullscreenButton();
      return;
    }


    /*
      別の要素が全画面なら終了する
    */

    if (document.fullscreenElement) {
      await document.exitFullscreen();
    }


    /*
      全画面になる直前の
      STOPボタンの大きさを保存
    */

    preserveStopButtonSize();


  /*
  iPhoneなどのタッチ端末では，
  画面回転でも解除されにくい
  疑似全画面を直接使用する
*/

if (isMobileFullscreenLayout()) {

  enterMobilePseudoFullscreen();

  hideMobileFullscreenButton();

  return;
}


    /*
      PCでは本当の全画面表示
    */

    await videoWrapper.requestFullscreen();

  } catch (error) {

    restoreStopButtonSize();

    console.error(
      "全画面表示の切り替えに失敗しました。",
      error
    );

    setStatus(
      "全画面表示に切り替えられませんでした。"
    );
  }
}


/*
  全画面ボタンを押したとき，
  背後のジョイスティック操作を発生させない
*/

pcFullscreenButton.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();
    event.stopPropagation();

    /*
      アイコン表示直後の連続タップは無視する
    */

    if (
      isMobileFullscreenLayout() &&
      mobileFullscreenButtonLocked
    ) {
      event.stopImmediatePropagation();
    }
  }
);


pcFullscreenButton.addEventListener(
  "click",
  event => {

    event.preventDefault();
    event.stopPropagation();

    /*
      アイコンが表示されてから1秒間は，
      全画面への切り替えを実行しない
    */

    if (
      isMobileFullscreenLayout() &&
      mobileFullscreenButtonLocked
    ) {
      return;
    }

    togglePcFullscreen();
  }
);




/*
  本当の全画面表示が変化したとき
*/

document.addEventListener(
  "fullscreenchange",
  () => {

    const isFullscreen =
      document.fullscreenElement ===
      videoWrapper;

   if (isFullscreen) {

  updateFullscreenIcon(true);

  /*
    全画面化後のvideoWrapperサイズで
    STOPボタンを再配置する
  */
  scheduleStopButtonGeometryApply();

} else {

  updateFullscreenIcon(false);

  /*
    通常画面へ戻ったあとのサイズで
    STOPボタンを再配置する
  */
  scheduleStopButtonGeometryApply();
}

    hideMobileFullscreenButton();
  }
);

    /*
  iPhoneを縦向き・横向きに変更したあと，
  疑似全画面とボタンの状態を整える
*/

function refreshMobileFullscreenAfterRotation() {

  /*
    Safariの画面サイズ更新が終わるまで
    少し待ってから処理する
  */

  setTimeout(
    () => {

      if (!isMobileFullscreenLayout()) {
        return;
      }


     /*
  長押し判定の途中状態をリセットする
*/

if (mobileFullscreenHoldTimer) {

  clearTimeout(
    mobileFullscreenHoldTimer
  );

  mobileFullscreenHoldTimer = null;
}

mobileFullscreenHoldTriggered = false;


      /*
        ボタンの一時ロックを解除する
      */

      mobileFullscreenButtonLocked = false;

      if (mobileFullscreenLockTimer) {

        clearTimeout(
          mobileFullscreenLockTimer
        );

        mobileFullscreenLockTimer = null;
      }

      pcFullscreenButton.removeAttribute(
        "aria-disabled"
      );


      /*
        疑似全画面中なら，
        横向きになっても疑似全画面を維持する
      */

    if (isMobilePseudoFullscreen()) {

  videoWrapper.classList.add(
    "mobilePseudoFullscreen"
  );

  document.body.classList.add(
    "mobilePseudoFullscreenActive"
  );

  /*
    回転後の実際の表示領域へ合わせ直す
  */

  updateMobilePseudoFullscreenViewport();

  updateFullscreenIcon(true);

  hideMobileFullscreenButton();

  return;
}


      /*
        通常表示中も，
        アイコンを出しっぱなしにしない
      */

      updateFullscreenIcon(false);
      hideMobileFullscreenButton();
    },
    350
  );
}


window.addEventListener(
  "orientationchange",
  refreshMobileFullscreenAfterRotation
);


/*
  iPhone Safariではorientationchange以外に，
  resizeだけが発生する場合もある
*/

window.addEventListener(
  "resize",
  refreshMobileFullscreenAfterRotation
);

    /*
  iPhone版Chromeでブラウザバーやタブ表示により
  実際に見えている範囲が変化したときの補正
*/

if (window.visualViewport) {

  window.visualViewport.addEventListener(
    "resize",
    () => {

      if (isMobilePseudoFullscreen()) {
        updateMobilePseudoFullscreenViewport();
      }
    }
  );

  window.visualViewport.addEventListener(
    "scroll",
    () => {

      if (isMobilePseudoFullscreen()) {
        updateMobilePseudoFullscreenViewport();
      }
    }
  );
}

    window.addEventListener("beforeunload", () => {
      stopAll(false);
    });

    // ======================================
// 詳細設定の保存
// ======================================

function loadSettings() {

  const savedPcKey =
    localStorage.getItem("pcStopKey");

  if (savedPcKey !== null) {
    pcStopKey.value = savedPcKey;
  }

  const savedGesture =
    localStorage.getItem(
      "iphoneStopGesture"
    );

  if (savedGesture !== null) {
    iphoneStopGesture.value =
      savedGesture;
  }
}


function saveSettings() {

  localStorage.setItem(
    "pcStopKey",
    pcStopKey.value
  );

  localStorage.setItem(
    "iphoneStopGesture",
    iphoneStopGesture.value
  );
}


// ----------
// 変更されたら保存
// ----------

pcStopKey.addEventListener(
  "change",
  saveSettings
);

iphoneStopGesture.addEventListener(
  "change",
  saveSettings
);




// ----------
// 起動時に読み込み
// ----------

loadSettings();
loadStopButtonGeometry();
    
  </script>
</body>
</html>
